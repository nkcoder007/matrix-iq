<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f9" />
    <meta
      name="description"
      content="MatrixIQ turns your documents into an explorable map of ideas — showing the connections you would not have noticed."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0f14'/%3E%3Cg stroke='%234adebd' stroke-width='1.4' fill='none'%3E%3Cpath d='M10 11l12 4M10 11l4 14M22 15l-8 10'/%3E%3C/g%3E%3Cg fill='%234adebd'%3E%3Ccircle cx='10' cy='11' r='2.6'/%3E%3Ccircle cx='22' cy='15' r='2.6'/%3E%3Ccircle cx='14' cy='25' r='2.2' fill='%23a78bfa'/%3E%3C/g%3E%3C/svg%3E"
    />
    <title>MatrixIQ — Knowledge, connected</title>
    <script>
      try {
        var theme = localStorage.getItem('matrixiq-theme');
        if (theme === 'dark' || theme === 'light') {
          document.documentElement.dataset.theme = theme;
        }
      } catch (error) {
        /* Storage can be unavailable in private browsing. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
