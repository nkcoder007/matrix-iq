services:
  - type: web
    name: matrixiq-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.12.0
      # Set this to the deployed Vercel origin, e.g. https://matrixiq.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Server-only secret. Never add this to Vercel or a VITE_* variable.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: SESSION_TTL_MS
        value: "1800000"
      - key: SESSION_SWEEP_MS
        value: "300000"
      - key: UPLOAD_MAX_BYTES
        value: "10485760"
      - key: PDF_MAX_PAGES
        value: "200"
